# Use the project's Python rather than console scripts with stale venv shebangs.
# Check application, MCP, deployment tooling, and tests.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(accounting|accounting_server|deploy|tests)/

  - repo: local
    hooks:
      - id: black
        name: black
        entry: .venv/bin/python -m black
        language: system
        types: [python]
        files: ^(accounting|accounting_server|deploy|tests)/

      - id: ruff-check
        name: ruff check
        entry: .venv/bin/python -m ruff
        language: system
        types: [python]
        files: ^(accounting|accounting_server|deploy|tests)/
        args: [check]

      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy
        language: system
        types: [python]
        files: ^(accounting|accounting_server|deploy|tests)/
        pass_filenames: false
        args: [--explicit-package-bases, accounting, accounting_server, deploy, tests]

      - id: bandit
        name: bandit
        entry: .venv/bin/python -m bandit
        language: system
        types: [python]
        files: ^(accounting|accounting_server|deploy|tests)/
        pass_filenames: false
        # Scan production code; test fixtures deliberately contain fake credentials.
        args: [-r, accounting, accounting_server, deploy, --quiet, --severity-level, medium, --confidence-level, high]

      - id: unittest
        name: unittest
        entry: .venv/bin/python -m unittest discover -s tests -p "test_*.py"
        language: system
        pass_filenames: false
        always_run: true
