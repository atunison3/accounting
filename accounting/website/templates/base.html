<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} | Accounting</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}?v={{ stylesheet_version() }}">
</head>
<body>
<header class="site-header">
    <nav class="nav container" aria-label="Main navigation">
        <a class="brand" href="{{ url_for('home') }}">accounting</a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('dashboard') }}">Workspace</a>
            <details class="nav-menu">
                <summary>Dashboards</summary>
                <div class="nav-menu-items">
                    <a href="{{ url_for('transactions_dashboard') }}">Transactions</a>
                    <a href="{{ url_for('analytics_dashboard') }}">Analytics</a>
                    <a href="{{ url_for('mileage_dashboard') }}">Mileage</a>
                </div>
            </details>
            <details class="nav-menu hamburger-menu">
                <summary aria-label="Open additional navigation"><span aria-hidden="true">☰</span><span class="menu-label">Menu</span></summary>
                <div class="nav-menu-items">
                    <a href="{{ url_for('chart_of_accounts') }}">Chart of accounts</a>
                    <a href="{{ url_for('balance_sheet') }}">Balance Sheet</a>
                    <a href="{{ url_for('income_statement_page') }}">Income Statement</a>
                    <a href="{{ url_for('upload_document') }}">Upload document</a>
                    <a href="{{ url_for('about') }}">About</a>
                    <a href="{{ url_for('signup') }}">Add user</a>
                    <a href="/docs">API docs</a>
                </div>
            </details>
        </div>
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="footer container">
    <p>Accounting application · <a href="/health">System health</a></p>
</footer>
</body>
</html>
