{% extends "base.html" %}
{% block content %}
<link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet">
<section class="page-heading"><p class="eyebrow">GENERAL LEDGER</p><h1>Transactions</h1><p class="lead">Select a business, then slice and drill through its transaction lines.</p></section>
<section class="selector-card">
    <div class="filters">
        <div><label for="transaction-business">Business</label><select id="transaction-business" required><option value="">Select a business</option>{% for business in businesses %}<option value="{{ business.id }}">{{ business.title }}</option>{% endfor %}</select></div>
        <div><label for="account-number">Account</label><select id="account-number"><option value="">All accounts</option></select></div>
        <div><label for="entry-type">Entry type</label><select id="entry-type"><option value="">Both</option><option value="debit">Debit</option><option value="credit">Credit</option></select></div>
        <div><label for="currency-code">Currency</label><select id="currency-code"><option value="">All currencies</option><option>USD</option><option>THB</option><option>TBH</option><option>CAD</option><option>EUR</option><option>GBP</option><option>AUD</option><option>JPY</option></select></div>
        <div><label for="has-document">Documents</label><select id="has-document"><option value="">All transactions</option><option value="true">With document</option><option value="false">Without document</option></select></div>
        <div><label for="amount-min">Minimum amount ($)</label><input id="amount-min" type="number" min="0" step="0.01"></div>
        <div><label for="amount-max">Maximum amount ($)</label><input id="amount-max" type="number" min="0" step="0.01"></div>
        <div><label for="days">Last N days</label><input id="days" type="number" min="1" value="90"></div>
        <div><label for="date-from">From date</label><input id="date-from" type="date"></div>
        <div><label for="date-to">To date</label><input id="date-to" type="date"></div>
        <div class="filter-actions"><button class="button primary" id="apply-filters" type="button">Apply filters</button><button class="button secondary" id="clear-filters" type="button">Clear</button></div>
    </div>
    <p class="filter-status" id="filter-status">Select a business to load transactions. The default date range is the last 90 days.</p>
</section>
<section class="table-card"><div id="transactions-table"></div></section>
<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
<script>
const business = document.getElementById('transaction-business');
const account = document.getElementById('account-number');
const status = document.getElementById('filter-status');
const currencySymbols = {USD: '$', TBH: '฿', THB: '฿', EUR: '€', GBP: '£', JPY: '¥', CAD: '$', AUD: '$'};
function money(value, currency) { return value === null ? '' : `${currencySymbols[currency] || currency} ${(value / 100).toFixed(2)}`; }
function debitFormatter(cell) { return cell.getData().is_debit ? money(cell.getValue(), cell.getData().currency_code) : ''; }
function creditFormatter(cell) { return cell.getData().is_debit ? '' : money(cell.getValue(), cell.getData().currency_code); }
const table = new Tabulator('#transactions-table', {layout: 'fitColumns', placeholder: 'Select a business to see transactions.', columns: [
    {title: 'Date', field: 'transaction_date', sorter: 'date'}, {title: 'Currency', field: 'currency_code', width: 95}, {title: 'Document', field: 'has_document', width: 105, formatter: cell => cell.getValue() ? 'Attached' : 'Missing'},
    {title: 'Description', field: 'description', minWidth: 180}, {title: 'Account', field: 'account_number', formatter: cell => `${cell.getValue()} · ${cell.getData().account_name}`},
    {title: 'Debit', field: 'amount_cents', hozAlign: 'right', formatter: debitFormatter}, {title: 'Credit', field: 'amount_cents', hozAlign: 'right', formatter: creditFormatter},
    {title: '', field: 'transaction_id', width: 290, formatter: cell => { const id = cell.getValue(); const back = encodeURIComponent(window.location.pathname + window.location.search); return `<a class="table-action" href="/transactions/${id}/edit?return_to=${back}">Edit</a> · <a class="button secondary" href="/transactions/${id}/documents">View documents</a> · <a class="table-action" href="/documents/upload?business_id=${business.value}&transaction_id=${id}&return_to=${encodeURIComponent(window.location.pathname + window.location.search)}">Attach</a>`; }}
], data: []});
async function loadAccounts() {
    account.innerHTML = '<option value="">All accounts</option>';
    if (!business.value) return;
    const response = await fetch(`/api/accounts?business_id=${business.value}`);
    if (!response.ok) return;
    (await response.json()).forEach(item => { account.add(new Option(`${item.account_number} · ${item.name}`, item.account_number)); });
    const selectedAccount = new URLSearchParams(window.location.search).get('account_number');
    if (selectedAccount) account.value = selectedAccount;
}
async function queryTransactions() {
    if (!business.value) { status.textContent = 'Select a business to load transactions.'; table.clearData(); return; }
    const params = new URLSearchParams({business_id: business.value, days: document.getElementById('days').value || '90'});
    const fields = {account_number: account.value, entry_type: document.getElementById('entry-type').value, currency_code: document.getElementById('currency-code').value, has_document: document.getElementById('has-document').value, amount_min: document.getElementById('amount-min').value, amount_max: document.getElementById('amount-max').value, date_from: document.getElementById('date-from').value, date_to: document.getElementById('date-to').value};
    Object.entries(fields).forEach(([key, value]) => { if (value) params.set(key, value); });
    window.history.replaceState({}, '', `/transactions?${params}`);
    status.textContent = 'Loading transactions…';
    const response = await fetch(`/api/transactions?${params}`);
    if (!response.ok) { status.textContent = 'Unable to load transactions.'; return; }
    const rows = await response.json();
    await table.replaceData(rows);
    status.textContent = `${rows.length} transaction line${rows.length === 1 ? '' : 's'} found.`;
}
business.addEventListener('change', async () => { await loadAccounts(); await queryTransactions(); });
document.getElementById('apply-filters').addEventListener('click', queryTransactions);
document.getElementById('clear-filters').addEventListener('click', async () => { document.querySelectorAll('.filters input').forEach(input => input.value = input.id === 'days' ? '90' : ''); document.getElementById('entry-type').value = ''; document.getElementById('currency-code').value = ''; document.getElementById('has-document').value = ''; account.value = ''; await queryTransactions(); });

// Restore the dashboard state after returning from an edit (and load it immediately).
(async function restoreFilters() {
    const params = new URLSearchParams(window.location.search);
    const values = {
        'transaction-business': params.get('business_id') || '',
        'currency-code': params.get('currency_code') || '',
        'has-document': params.get('has_document') || '',
        'entry-type': params.get('entry_type') || '',
        'amount-min': params.get('amount_min') || '',
        'amount-max': params.get('amount_max') || '',
        'days': params.get('days') || '90',
        'date-from': params.get('date_from') || '',
        'date-to': params.get('date_to') || ''
    };
    Object.entries(values).forEach(([id, value]) => { document.getElementById(id).value = value; });
    if (business.value) { await loadAccounts(); await queryTransactions(); }
})();
</script>
{% endblock %}
