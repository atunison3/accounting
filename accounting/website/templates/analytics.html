{% extends "base.html" %}
{% block content %}
<section class="page-heading"><p class="eyebrow">REPORTING</p><h1>Business analytics</h1><p class="lead">Track cumulative owner's equity over time. Every supported transaction is converted to USD before calculation.</p></section>
<section class="selector-card">
    <label for="analytics-business">Business</label>
    <select id="analytics-business"><option value="">Select a business</option>{% for business in businesses %}<option value="{{ business.id }}"{% if business.id == selected_business_id %} selected{% endif %}>{{ business.title }}</option>{% endfor %}</select>
    <p class="filter-status" id="analytics-status">Select a business to load the equity chart.</p>
</section>
<section class="table-card chart-card"><div id="equity-chart" aria-label="Owner's equity over time"></div></section>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const businessSelect = document.getElementById('analytics-business');
const chart = document.getElementById('equity-chart');
const chartStatus = document.getElementById('analytics-status');
function renderEquity(data) {
    chart.innerHTML = '';
    if (!data.length) { chartStatus.textContent = 'No equity transactions found for this business.'; return; }
    const width = Math.max(chart.clientWidth, 640), height = 360;
    const margin = {top: 24, right: 28, bottom: 55, left: 78};
    const svg = d3.select(chart).append('svg').attr('viewBox', `0 0 ${width} ${height}`).attr('role', 'img');
    const points = data.map(item => ({date: new Date(`${item.date}T00:00:00`), value: item.equity_usd_cents / 100}));
    const x = d3.scaleTime().domain(d3.extent(points, d => d.date)).range([margin.left, width - margin.right]);
    const extent = d3.extent(points, d => d.value);
    const padding = Math.max((extent[1] - extent[0]) * 0.1, 1);
    const y = d3.scaleLinear().domain([Math.min(0, extent[0] - padding), extent[1] + padding]).nice().range([height - margin.bottom, margin.top]);
    svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(Math.min(points.length, 8)).tickFormat(d3.timeFormat('%b %Y'))).selectAll('text').attr('transform', 'rotate(-25)').style('text-anchor', 'end');
    svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).tickFormat(value => `$${d3.format(',')(value)}`));
    svg.append('path').datum(points).attr('fill', 'none').attr('stroke', '#2563eb').attr('stroke-width', 3).attr('d', d3.line().x(d => x(d.date)).y(d => y(d.value)));
    svg.selectAll('circle').data(points).join('circle').attr('cx', d => x(d.date)).attr('cy', d => y(d.value)).attr('r', 4).attr('fill', '#2563eb').append('title').text(d => `${d3.timeFormat('%Y-%m-%d')(d.date)}: $${d3.format(',.2f')(d.value)}`);
    chartStatus.textContent = `${data.length} equity balance point${data.length === 1 ? '' : 's'} · USD`;
}
async function loadEquity() {
    if (!businessSelect.value) { chart.innerHTML = ''; chartStatus.textContent = 'Select a business to load the equity chart.'; return; }
    chartStatus.textContent = 'Loading equity analytics…';
    const response = await fetch(`/api/analytics/equity?business_id=${businessSelect.value}`);
    if (!response.ok) { chartStatus.textContent = 'Unable to load analytics.'; return; }
    renderEquity(await response.json());
    window.history.replaceState({}, '', `/analytics?business_id=${businessSelect.value}`);
}
businessSelect.addEventListener('change', loadEquity);
if (businessSelect.value) loadEquity();
</script>
{% endblock %}
