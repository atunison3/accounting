[project]
name = "accounting"
version = "0.2.1"
license = { file = "LICENSE" }
description = "A simple accounting system with dunder addition support"
authors = [
    { name="Andy Tunison", email="andrew.e.tunison@gmail.com" }
]
dependencies = [
    "pydantic[email]>=2.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "reportlab>=4.0",
    "mcp>=1.26,<2",
]

[project.scripts]
accounting-mcp = "accounting_server.server:main"

[tool.black]
line-length = 120
target-version = ['py311']
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
lint.select = ["E", "F", "W", "C90", "B", "I", "PL"]
lint.ignore = ["F403", "PLR2004", "I001"]
exclude = ["build", "dist", ".venv"]

[tool.bandit]
skips = ["B101"]  # Optional: skip assert usage warnings
exclude = ["tests"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
branch = true
source = ["."]

[tool.setuptools.package-data]
"accounting.infrastructure.sqlite" = ["*.sql"]
"accounting.website" = ["templates/*.html", "static/*", "static/**/*"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "accounting",
    "accounting.*",
    "accounting_server",
    "accounting_server.*",
]
exclude = ["tests", "tests.*", "examples", "examples.*"]
