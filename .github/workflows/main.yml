name: Python Quality Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    name: Shared pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pinned dependencies into the hook environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install .

      - name: Report quality-tool versions
        run: |
          .venv/bin/python --version
          .venv/bin/python -m black --version
          .venv/bin/python -m ruff --version
          .venv/bin/python -m mypy --version
          .venv/bin/python -m bandit --version
          .venv/bin/python -m pre_commit --version

      - name: Run the same hooks as local development
        run: .venv/bin/python -m pre_commit run --all-files --show-diff-on-failure
